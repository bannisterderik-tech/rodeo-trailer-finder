<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Haulin' Hooves — private beta</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="6;url=index.html#beta">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;500;600&family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#EEF3E4,#F4EBD9);font-family:'Archivo',system-ui,sans-serif;color:#2C2118;text-align:center}
  .card{max-width:520px;background:#FFFBF1;border:1px solid rgba(74,48,22,.14);border-radius:24px;padding:40px 32px;box-shadow:0 26px 60px rgba(58,85,48,.18)}
  .eyebrow{font:600 11px 'Oswald',sans-serif;letter-spacing:2.5px;text-transform:uppercase;color:#5E7A4E}
  h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:44px;letter-spacing:1px;line-height:.95;margin:10px 0 12px}
  h1 span{color:#A83E23}
  p{font-size:15px;color:#6b543a;line-height:1.55;margin:0 0 22px}
  .btn{display:inline-block;font:400 19px 'Bebas Neue',sans-serif;letter-spacing:1.5px;color:#FBF3E4;background:linear-gradient(180deg,#C25232,#A83E23);border-radius:13px;padding:15px 26px;text-decoration:none;box-shadow:0 10px 24px rgba(168,62,35,.32)}
  .alt{display:block;margin-top:14px;font:600 11px 'Oswald',sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:#5E7A4E;text-decoration:none}
  .fine{margin-top:22px;font-size:11px;color:#9c855f}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Haulin' Hooves</div>
    <h1>The demo is in <span>private beta.</span></h1>
    <p>We're inviting haulers in waves. Request access and we'll email you when your spot opens — and tell us what you'd need it to do.</p>
    <a class="btn" href="index.html#beta">Request early access →</a>
    <a class="alt" href="index.html#feedback">Or leave feedback &amp; feature requests</a>
    <div class="fine">Taking you to the site in a moment…</div>
  </div>
</body>
</html>
